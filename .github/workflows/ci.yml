name: CI
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  timing:
    name: Paired PR timing (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
    env:
      SHARD: ${{ matrix.shard }}
      SOLIDCRAFT_GPU: software
      SOLIDCRAFT_REQUIRE_GPU: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 8e59199a0d49e8f8ca7d473be8ed96c863d2cd0e
    - name: Install software Vulkan
      run: 'sudo apt-get update

        sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1

        '
    - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
      with:
        tool: cargo-nextest@0.9.148
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: nextest-archive
        run-id: 38912242327
        github-token: ${{ github.token }}
    - name: Prepare captured PR workflow commands
      run: "cat > /tmp/paired-commands.json <<'COMMANDS'\n{\"1\": {\"before\": [{\"name\": \"Run tests\", \"argv\": [\"cargo\"\
        , \"nextest\", \"run\", \"--archive-file\", \"tests.tar.zst\", \"--workspace-remap\", \".\", \"--extract-to\", \"\
        .\", \"--extract-overwrite\", \"--profile\", \"ci\", \"--partition\", \"slice:1/4\"]}, {\"name\": \"Robustness goldens\
        \ sample (pull requests that touch the kernel)\", \"argv\": [\"cargo\", \"nextest\", \"run\", \"--archive-file\",\
        \ \"tests.tar.zst\", \"--workspace-remap\", \".\", \"--extract-to\", \".\", \"--extract-overwrite\", \"--profile\"\
        , \"ci\", \"--ignore-default-filter\", \"-E\", \"package(solidcraft-engine) & test(=tests::robustness_goldens::sample_0)\"\
        ]}, {\"name\": \"Tangent primitive boolean regression (pull requests that touch the kernel)\", \"argv\": [\"cargo\"\
        , \"nextest\", \"run\", \"--archive-file\", \"tests.tar.zst\", \"--workspace-remap\", \".\", \"--extract-to\", \"\
        .\", \"--extract-overwrite\", \"--profile\", \"ci\", \"--ignore-default-filter\", \"-E\", \"package(solidcraft-kernel)\
        \ & test(=tests::boolean_identity_on_tangent_primitives)\"]}], \"after\": [{\"name\": \"Run tests\", \"argv\": [\"\
        cargo\", \"nextest\", \"run\", \"--archive-file\", \"tests.tar.zst\", \"--workspace-remap\", \".\", \"--extract-to\"\
        , \".\", \"--extract-overwrite\", \"--profile\", \"ci\", \"--partition\", \"slice:1/4\", \"--no-tests=pass\"]}, {\"\
        name\": \"Kernel regressions (pull requests that touch the kernel)\", \"argv\": [\"cargo\", \"nextest\", \"run\",\
        \ \"--archive-file\", \"tests.tar.zst\", \"--workspace-remap\", \".\", \"--extract-to\", \".\", \"--extract-overwrite\"\
        , \"--profile\", \"ci\", \"--ignore-default-filter\", \"-E\", \"package(solidcraft-engine) & test(=tests::robustness_goldens::sample_0)\"\
        ]}]}, \"2\": {\"before\": [{\"name\": \"Run tests\", \"argv\": [\"cargo\", \"nextest\", \"run\", \"--archive-file\"\
        , \"tests.tar.zst\", \"--workspace-remap\", \".\", \"--extract-to\", \".\", \"--extract-overwrite\", \"--profile\"\
        , \"ci\", \"--partition\", \"slice:2/4\"]}, {\"name\": \"Robustness goldens sample (pull requests that touch the kernel)\"\
        , \"argv\": [\"cargo\", \"nextest\", \"run\", \"--archive-file\", \"tests.tar.zst\", \"--workspace-remap\", \".\"\
        , \"--extract-to\", \".\", \"--extract-overwrite\", \"--profile\", \"ci\", \"--ignore-default-filter\", \"-E\", \"\
        package(solidcraft-engine) & test(=tests::robustness_goldens::sample_1)\"]}, {\"name\": \"Tangent primitive boolean\
        \ regression (pull requests that touch the kernel)\", \"argv\": [\"cargo\", \"nextest\", \"run\", \"--archive-file\"\
        , \"tests.tar.zst\", \"--workspace-remap\", \".\", \"--extract-to\", \".\", \"--extract-overwrite\", \"--profile\"\
        , \"ci\", \"--ignore-default-filter\", \"-E\", \"package(solidcraft-kernel) & test(=tests::boolean_identity_on_tangent_primitives)\"\
        ]}], \"after\": [{\"name\": \"Run tests\", \"argv\": [\"cargo\", \"nextest\", \"run\", \"--archive-file\", \"tests.tar.zst\"\
        , \"--workspace-remap\", \".\", \"--extract-to\", \".\", \"--extract-overwrite\", \"--profile\", \"ci\", \"--partition\"\
        , \"slice:2/4\", \"--no-tests=pass\"]}, {\"name\": \"Kernel regressions (pull requests that touch the kernel)\", \"\
        argv\": [\"cargo\", \"nextest\", \"run\", \"--archive-file\", \"tests.tar.zst\", \"--workspace-remap\", \".\", \"\
        --extract-to\", \".\", \"--extract-overwrite\", \"--profile\", \"ci\", \"--ignore-default-filter\", \"-E\", \"package(solidcraft-engine)\
        \ & test(=tests::robustness_goldens::sample_1) | (package(solidcraft-kernel) & test(=tests::boolean_identity_on_tangent_primitives))\"\
        ]}]}, \"3\": {\"before\": [{\"name\": \"Run tests\", \"argv\": [\"cargo\", \"nextest\", \"run\", \"--archive-file\"\
        , \"tests.tar.zst\", \"--workspace-remap\", \".\", \"--extract-to\", \".\", \"--extract-overwrite\", \"--profile\"\
        , \"ci\", \"--partition\", \"slice:3/4\"]}, {\"name\": \"Robustness goldens sample (pull requests that touch the kernel)\"\
        , \"argv\": [\"cargo\", \"nextest\", \"run\", \"--archive-file\", \"tests.tar.zst\", \"--workspace-remap\", \".\"\
        , \"--extract-to\", \".\", \"--extract-overwrite\", \"--profile\", \"ci\", \"--ignore-default-filter\", \"-E\", \"\
        package(solidcraft-engine) & test(=tests::robustness_goldens::sample_2)\"]}, {\"name\": \"Tangent primitive boolean\
        \ regression (pull requests that touch the kernel)\", \"argv\": [\"cargo\", \"nextest\", \"run\", \"--archive-file\"\
        , \"tests.tar.zst\", \"--workspace-remap\", \".\", \"--extract-to\", \".\", \"--extract-overwrite\", \"--profile\"\
        , \"ci\", \"--ignore-default-filter\", \"-E\", \"package(solidcraft-kernel) & test(=tests::boolean_identity_on_tangent_primitives)\"\
        ]}], \"after\": [{\"name\": \"Run tests\", \"argv\": [\"cargo\", \"nextest\", \"run\", \"--archive-file\", \"tests.tar.zst\"\
        , \"--workspace-remap\", \".\", \"--extract-to\", \".\", \"--extract-overwrite\", \"--profile\", \"ci\", \"--partition\"\
        , \"slice:3/4\", \"--no-tests=pass\"]}, {\"name\": \"Kernel regressions (pull requests that touch the kernel)\", \"\
        argv\": [\"cargo\", \"nextest\", \"run\", \"--archive-file\", \"tests.tar.zst\", \"--workspace-remap\", \".\", \"\
        --extract-to\", \".\", \"--extract-overwrite\", \"--profile\", \"ci\", \"--ignore-default-filter\", \"-E\", \"package(solidcraft-engine)\
        \ & test(=tests::robustness_goldens::sample_2)\"]}]}, \"4\": {\"before\": [{\"name\": \"Run tests\", \"argv\": [\"\
        cargo\", \"nextest\", \"run\", \"--archive-file\", \"tests.tar.zst\", \"--workspace-remap\", \".\", \"--extract-to\"\
        , \".\", \"--extract-overwrite\", \"--profile\", \"ci\", \"--partition\", \"slice:4/4\"]}, {\"name\": \"Robustness\
        \ goldens sample (pull requests that touch the kernel)\", \"argv\": [\"cargo\", \"nextest\", \"run\", \"--archive-file\"\
        , \"tests.tar.zst\", \"--workspace-remap\", \".\", \"--extract-to\", \".\", \"--extract-overwrite\", \"--profile\"\
        , \"ci\", \"--ignore-default-filter\", \"-E\", \"package(solidcraft-engine) & test(=tests::robustness_goldens::sample_3)\"\
        ]}, {\"name\": \"Tangent primitive boolean regression (pull requests that touch the kernel)\", \"argv\": [\"cargo\"\
        , \"nextest\", \"run\", \"--archive-file\", \"tests.tar.zst\", \"--workspace-remap\", \".\", \"--extract-to\", \"\
        .\", \"--extract-overwrite\", \"--profile\", \"ci\", \"--ignore-default-filter\", \"-E\", \"package(solidcraft-kernel)\
        \ & test(=tests::boolean_identity_on_tangent_primitives)\"]}], \"after\": [{\"name\": \"Run tests\", \"argv\": [\"\
        cargo\", \"nextest\", \"run\", \"--archive-file\", \"tests.tar.zst\", \"--workspace-remap\", \".\", \"--extract-to\"\
        , \".\", \"--extract-overwrite\", \"--profile\", \"ci\", \"--partition\", \"slice:4/4\", \"--no-tests=pass\"]}, {\"\
        name\": \"Kernel regressions (pull requests that touch the kernel)\", \"argv\": [\"cargo\", \"nextest\", \"run\",\
        \ \"--archive-file\", \"tests.tar.zst\", \"--workspace-remap\", \".\", \"--extract-to\", \".\", \"--extract-overwrite\"\
        , \"--profile\", \"ci\", \"--ignore-default-filter\", \"-E\", \"package(solidcraft-engine) & test(=tests::robustness_goldens::sample_3)\"\
        ]}]}}\nCOMMANDS\ncat > /tmp/paired-runner.py <<'PY'\nimport hashlib,json,os,subprocess,time,xml.etree.ElementTree\
        \ as ET\nfrom pathlib import Path\nout=Path('timing-out');out.mkdir(exist_ok=True)\nshard=int(os.environ['SHARD'])\n\
        commands=json.loads(Path('/tmp/paired-commands.json').read_text())[str(shard)]\ndef digest(p):\n h=hashlib.sha256()\n\
        \ with open(p,'rb') as f:\n  for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)\n return h.hexdigest()\n\
        archive_hash=digest('tests.tar.zst')\n(out/'archive.sha256').write_text(archive_hash+'\\n')\nfor name,args in [('cpu',['lscpu']),('cpu-count',['nproc']),('os',['uname','-a'])]:\n\
        \ (out/(name+'.txt')).write_bytes(subprocess.check_output(args))\n(out/'image-version.txt').write_text(os.environ.get('ImageVersion','unknown'))\n\
        (out/'clock-ticks.txt').write_text(str(os.sysconf('SC_CLK_TCK')))\n# Extract once for test discovery and hash each\
        \ binary; both variants use the same archive.\nwith (out/'listing.json').open('w') as f:\n subprocess.run(['cargo','nextest','list','--archive-file','tests.tar.zst','--workspace-remap','.','--extract-to','.','--extract-overwrite','--profile','ci','--message-format','json'],stdout=f,check=True)\n\
        listing=json.loads((out/'listing.json').read_text())\nbinary_hashes={s['binary-path']:digest(s['binary-path']) for\
        \ s in listing['rust-suites'].values()}\n(out/'binaries-before.json').write_text(json.dumps(binary_hashes,indent=2))\n\
        order=['before','after'] if shard%2 else ['after','before']\nresults=[];bad=False\nfor version in order:\n for index,call\
        \ in enumerate(commands[version]):\n  name=f'{version}-{index}'\n  (out/(name+'-cpu-before.txt')).write_text(Path('/proc/stat').read_text())\n\
        \  (out/(name+'-processes.txt')).write_bytes(subprocess.check_output(['ps','-eo','pid,pcpu,comm','--sort=-pcpu']))\n\
        \  t=time.monotonic()\n  with (out/(name+'.log')).open('wb') as log:\n   run=subprocess.run(['/usr/bin/time','-f','%e\\\
        t%U\\t%S\\t%x','-o',str(out/(name+'-time.tsv')),*call['argv']],stdout=log,stderr=subprocess.STDOUT)\n  elapsed=time.monotonic()-t\n\
        \  (out/(name+'-cpu-after.txt')).write_text(Path('/proc/stat').read_text())\n  junit=Path('target/nextest/ci/junit.xml')\n\
        \  if junit.exists(): junit.rename(out/(name+'.xml'))\n  row={'variant':version,'index':index,'name':call['name'],'argv':call['argv'],'elapsed':elapsed,'exit_code':run.returncode,'timing':(out/(name+'-time.tsv')).read_text().strip()}\n\
        \  results.append(row);print(json.dumps(row),flush=True)\n  (out/'results.json').write_text(json.dumps({'shard':shard,'order':order,'results':results},indent=2))\n\
        \  if run.returncode:\n   print((out/(name+'.log')).read_text(errors='replace')[-16000:],flush=True)\n   bad=True;break\n\
        \ if bad:break\nbinary_hashes_after={p:digest(p) for p in binary_hashes}\n(out/'binaries-after.json').write_text(json.dumps(binary_hashes_after,indent=2))\n\
        assert binary_hashes==binary_hashes_after,'test binaries changed'\nassert digest('tests.tar.zst')==archive_hash,'archive\
        \ changed'\nassert not bad,'test execution failed; comparison invalid'\nPY\nmkdir -p timing-out\ncat > timing-out/upstream-boolean-failure.json\
        \ <<'EVIDENCE'\n{\n  \"upstream_commit\": \"77bdef2f6434b09fba321f3a29609f68fa583b00\",\n  \"operation\": \"Union\"\
        ,\n  \"box\": {\n    \"min\": [\n      12.5,\n      0,\n      7.5\n    ],\n    \"max\": [\n      17.5,\n      5,\n\
        \      12.5\n    ]\n  },\n  \"sphere\": {\n    \"center\": [\n      5,\n      2.5,\n      17.5\n    ],\n    \"radius\"\
        : 12.5\n  },\n  \"scale_1_validity\": [\n    \"1 face(s) don't mesh\"\n  ],\n  \"scale_0_05_validity\": [],\n  \"\
        reproduced_without_optimization_changes\": true,\n  \"status\": \"unfixed upstream geometry issue; unrelated to test\
        \ scheduling\",\n  \"related_upstream_issue\": \"https://github.com/bherbruck/solidcraft/issues/1648\",\n  \"relation\"\
        : \"Same reported failure category; the saved input is a separate example.\"\n}\n\nEVIDENCE\ncat > timing-out/upstream-boolean-probe.rs\
        \ <<'EVIDENCE'\n\n#[test]\nfn saved_box_sphere_union_scale_regression() {\n    let mut results = Vec::new();\n   \
        \ for k in [1.0, 0.05] {\n        let a = box_solid(Vec3::new(12.5, 0.0, 7.5) * k, Vec3::new(17.5, 5.0, 12.5) * k).unwrap();\n\
        \        let b = sphere(Vec3::new(5.0, 2.5, 17.5) * k, 12.5 * k).unwrap();\n        let body = boolean(&a, &b, BoolOp::Union).unwrap().unwrap();\n\
        \        let issues = body.validity();\n        eprintln!(\"scale {k}: validity {issues:?}\");\n        results.push(issues);\n\
        \    }\n    assert!(results.iter().all(Vec::is_empty), \"{results:?}\");\n}\n\nEVIDENCE\ncat > timing-out/upstream-boolean-probe.log\
        \ <<'EVIDENCE'\nrunning 1 test\ntest saved_box_sphere_union_scale_regression ... scale 1: validity [\"1 face(s) don't\
        \ mesh\"]\nscale 0.05: validity []\n\nthread 'saved_box_sphere_union_scale_regression' (577627) panicked at crates/kernel/tests/boolean_props.rs:285:5:\n\
        [[\"1 face(s) don't mesh\"], []]\nnote: run with `RUST_BACKTRACE=1` environment variable to display a backtrace\n\
        FAILED\n\nfailures:\n\nfailures:\n    saved_box_sphere_union_scale_regression\n\ntest result: FAILED. 0 passed; 1\
        \ failed; 0 ignored; 0 measured; 12 filtered out; finished in 1.54s\n\nerror: test failed, to rerun pass `-p solidcraft-kernel\
        \ --test boolean_props`\n\nEVIDENCE\n"
    - name: Run both variants on this VM
      run: python3 /tmp/paired-runner.py
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: paired-timing-${{ matrix.shard }}
        path: timing-out
        retention-days: 7
